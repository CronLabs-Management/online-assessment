<dl class="grid gap-4 sm:grid-cols-3 bg-[#EEF1FE]/50 p-4 sm:p-5 rounded-2xl border-[1.5px] border-[#D5DEFB]/80">
  <div class="flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-xl bg-[#EEF1FE] flex items-center justify-center text-[#2447F5] shrink-0 border border-blue-200/50">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <path d="M16 2v4"></path>
        <path d="M8 2v4"></path>
        <path d="M3 10h18"></path>
      </svg>
    </div>
    <div>
      <dt class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Window Opens</dt>
      <dd class="num text-sm sm:text-base font-extrabold text-slate-900 mt-0.5">{{ exam.opens_at|localtime|date:"D, d M H:i" }}</dd>
    </div>
  </div>
  <div class="flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-xl bg-[#EEF1FE] flex items-center justify-center text-[#2447F5] shrink-0 border border-blue-200/50">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v5l3 2"></path>
      </svg>
    </div>
    <div>
      <dt class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Window Closes</dt>
      <dd class="num text-sm sm:text-base font-extrabold text-slate-900 mt-0.5">{{ exam.closes_at|localtime|date:"D, d M H:i" }}</dd>
    </div>
  </div>
  <div class="flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-xl bg-[#EEF1FE] flex items-center justify-center text-[#2447F5] shrink-0 border border-blue-200/50">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
      </svg>
    </div>
    <div>
      <dt class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Duration</dt>
      <dd class="num text-sm sm:text-base font-extrabold text-slate-900 mt-0.5">{{ exam.duration_minutes }} minutes</dd>
    </div>
  </div>
</dl>
