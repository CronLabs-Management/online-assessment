<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject|default:"Assessment Notification" }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #1e293b;
    }
    table {
      border-collapse: collapse;
    }
    .wrapper {
      width: 100%;
      max-width: 600px;
      margin: 32px auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 32px 28px;
      text-align: center;
    }
    .brand-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 0;
      text-decoration: none;
    }
    .content {
      padding: 36px 32px;
    }
    .h1 {
      color: #0f172a;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 16px 0;
      letter-spacing: -0.2px;
    }
    .p {
      color: #475569;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 16px 0;
    }
    .btn {
      display: inline-block;
      padding: 13px 28px;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }
    .footer {
      background-color: #f8fafc;
      padding: 24px 32px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f1f5f9; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" bgcolor="#f1f5f9">
    <tr>
      <td align="center" style="padding: 24px 12px;">
        <table class="wrapper" align="center" cellpadding="0" cellspacing="0" style="margin:24px auto; max-width:600px; width:100%; background:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e2e8f0; box-shadow:0 4px 18px rgba(15,23,42,0.08);">
          <!-- Header -->
          <tr>
            <td class="header" style="background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding:28px 24px; text-align:center;">
              <h2 style="color:#ffffff; margin:0; font-size:22px; font-weight:700; letter-spacing:-0.3px;">
                {{ site_name|default:"Scrambler Assessments" }}
              </h2>
            </td>
          </tr>
          <!-- Main Content -->
          <tr>
            <td class="content" style="padding:32px 28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td class="footer" style="background-color:#f8fafc; padding:24px 28px; text-align:center; font-size:13px; color:#64748b; border-top:1px solid #e2e8f0;">
              This is an automated message from {{ site_name|default:"Scrambler Assessments" }}.<br>
              Please do not reply directly to this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
